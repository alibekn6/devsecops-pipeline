stages:
  - test
  - build
  - smoke 

test_job:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim

  script:
    - cd app 
    - uv sync --locked
    - uv run pytest -v

build_job:
  stage: build
  image: docker:latest

  script:
    - cd app
    - docker build -t app:$CI_COMMIT_SHORT_SHA .


smoke_job:
  stage: smoke
  image: docker:latest
  variables:
    APP: app-smoke-$CI_JOB_ID
  script:
    - docker run -d --name $APP app:$CI_COMMIT_SHORT_SHA
    - docker run --rm --network container:$APP curlimages/curl
        -f --retry 10 --retry-delay 2 --retry-connrefused
        http://localhost:8000/health
  after_script:
    - docker rm -f $APP 