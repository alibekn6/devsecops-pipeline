services:
  gitlab-runner:
    image: gitlab/gitlab-runner:v19.5.3@sha256:ffe21f021468d4aa1e56f05316d88597c23bf4818840e8edaa858131fabd7991
    container_name: gitlab-runner
    restart: unless-stopped
    volumes:
      - ./runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  vault:
    image: hashicorp/vault:2.2.2@sha256:dfa48c2fa2b0099ccb47681ec5c4804bf5aec9d6879ecfee07ad4b92a5427ad6
    restart: unless-stopped
    command: server
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/file
      - ./vault/config:/vault/config:ro
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  runner-config:
  vault-data:
